name: MCP Tests

on:
  workflow_dispatch:
    inputs:
      skip_convert:
        description: 'Pular etapa de conversão (usar configs existentes)'
        type: boolean
        default: true
      llm_provider:
        description: 'Provider do LLM'
        type: choice
        options:
          - openai
          - anthropic
        default: 'openai'
      llm_model:
        description: 'Modelo do LLM (ex: gpt-5-mini, claude-4-5-haiku-20251001)'
        type: string
        default: 'gpt-5-mini'

permissions:
  contents: read
  actions: read

jobs:
  # ===========================================================================
  # JOB 1: Conversão de código para configs YAML/JSON
  # ===========================================================================
  convert:
    name: Convert code to configs
    if: ${{ github.event.inputs.skip_convert != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # -------------------------------------------------------------------------
      # STEP 1.1: Conversão code2NL (venv com langchain)
      # -------------------------------------------------------------------------
      - name: Create langchain venv
        working-directory: tcc-tests
        run: |
          uv venv .venv-langchain
          source .venv-langchain/bin/activate
          uv pip install langchain-openai python-dotenv pydantic

      - name: Convert code to natural language
        working-directory: tcc-tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          source .venv-langchain/bin/activate
          
          PROJECTS="todomvc svgomg mock-filesystem mock-battery"
          
          echo "📁 Processando projetos: $PROJECTS"
          
          for project in $PROJECTS; do
            echo "🔄 Convertendo código de $project para linguagem natural..."
            python -m scripts.converter.convert_code_to_natural_language \
              ../examples/$project || echo "⚠️ Falha em $project, continuando..."
          done

      # -------------------------------------------------------------------------
      # STEP 1.2: Geração de configs YAML/JSON (venv limpo, sem langchain)
      # -------------------------------------------------------------------------
      - name: Create clean venv for config generation
        working-directory: tcc-tests
        run: |
          uv venv .venv-config
          source .venv-config/bin/activate
          uv pip install pyyaml pydantic

      - name: Generate YAML/JSON configs
        working-directory: tcc-tests
        run: |
          source .venv-config/bin/activate
          
          PROJECTS="todomvc svgomg mock-filesystem mock-battery"
          
          echo "📁 Gerando configs para: $PROJECTS"
          
          for project in $PROJECTS; do
            echo "🔄 Gerando config para $project..."
            python -m scripts.converter.generate_config $project || echo "⚠️ Falha em $project, continuando..."
          done

      - name: Upload generated configs
        uses: actions/upload-artifact@v4
        with:
          name: mcp-configs
          path: tcc-tests/tests/example/*/config/
          if-no-files-found: warn

  # ===========================================================================
  # JOB 2: Testes de projetos EXTERNOS (já estão online)
  # ===========================================================================
  test-external:
    name: MCP Test (${{ matrix.project }})
    needs: convert
    if: always() && (needs.convert.result == 'success' || needs.convert.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - todomvc
          - svgomg
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Download configs gerados (se o job convert rodou)
      - name: Download generated configs
        if: needs.convert.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: mcp-configs
          path: tcc-tests/tests/example/

      # -------------------------------------------------------------------------
      # Gera classificação de beforeEach para aplicar mocks/scripts automaticamente
      # -------------------------------------------------------------------------
      - name: Generate beforeEach classification
        run: |
          npm ci
          npx tsc -p scripts/tsconfig.json
          node scripts/dist/classifyBeforeEach.js

      - name: Install dependencies (MCP extras)
        working-directory: tcc-tests
        run: uv sync --extra mcp

      - name: Install Playwright browsers
        working-directory: tcc-tests
        run: uv run playwright install --with-deps chromium

      - name: Execute MCP suite
        working-directory: tcc-tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python -m scripts.executer.mcp_executor \
            --suite @example/${{ matrix.project }} \
            --llm-provider ${{ github.event.inputs.llm_provider || 'openai' }} \
            --llm-model "${{ github.event.inputs.llm_model || 'gpt-5-mini' }}" \
            --output-json reports

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.project }}-artifacts
          path: |
            tcc-tests/artifacts/
            tcc-tests/reports/
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 3: Testes de projetos LOCAIS (precisam de deploy)
  # ===========================================================================
  test-local:
    name: MCP Test (${{ matrix.project }}) [local server]
    needs: convert
    if: always() && (needs.convert.result == 'success' || needs.convert.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - mock-battery
          - mock-filesystem
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Download configs gerados (se o job convert rodou)
      - name: Download generated configs
        if: needs.convert.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: mcp-configs
          path: tcc-tests/tests/example/

      # -------------------------------------------------------------------------
      # Gera classificação de beforeEach para aplicar mocks/scripts automaticamente
      # -------------------------------------------------------------------------
      - name: Generate beforeEach classification
        run: |
          npm ci
          npx tsc -p scripts/tsconfig.json
          node scripts/dist/classifyBeforeEach.js

      # -------------------------------------------------------------------------
      # Deploy do servidor local para o projeto
      # -------------------------------------------------------------------------
      - name: Install project dependencies
        working-directory: examples/${{ matrix.project }}
        run: npm i

      - name: Start local server
        working-directory: examples/${{ matrix.project }}
        run: |
          npm run start &
          echo "⏳ Aguardando servidor iniciar na porta 9900..."
          npx wait-on http://localhost:9900 --timeout 30000
          echo "✅ Servidor iniciado!"

      # -------------------------------------------------------------------------
      # Execução dos testes MCP
      # -------------------------------------------------------------------------
      - name: Install MCP dependencies (extras)
        working-directory: tcc-tests
        run: uv sync --extra mcp

      - name: Install Playwright browsers
        working-directory: tcc-tests
        run: uv run playwright install --with-deps chromium

      - name: Execute MCP suite
        working-directory: tcc-tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python -m scripts.executer.mcp_executor \
            --suite @example/${{ matrix.project }} \
            --llm-provider ${{ github.event.inputs.llm_provider || 'openai' }} \
            --llm-model "${{ github.event.inputs.llm_model || 'gpt-5-mini' }}" \
            --output-json reports

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.project }}-artifacts
          path: |
            tcc-tests/artifacts/
            tcc-tests/reports/
          if-no-files-found: ignore

  # ===========================================================================
  # JOB 4: Consolidação dos resultados
  # ===========================================================================
  summarize:
    name: Summarize MCP results
    needs: [test-external, test-local]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: mcp-*-artifacts
          merge-multiple: false

      - name: Generate summary
        run: |
          echo "# 🤖 MCP Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Provider:** ${{ github.event.inputs.llm_provider || 'openai' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Model:** ${{ github.event.inputs.llm_model || 'gpt-5-mini' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Projetos Externos (online)" >> $GITHUB_STEP_SUMMARY
          echo "| Projeto | Status | Custo |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          
          for project in todomvc svgomg; do
            dir="all-artifacts/mcp-${project}-artifacts"
            if [ -d "$dir" ]; then
              report=$(find "$dir" -name "mcp-report*.json" -path "*/reports/*" 2>/dev/null | head -1)
              
              if [ -n "$report" ] && [ -f "$report" ]; then
                passed=$(cat "$report" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('passed',0))" 2>/dev/null || echo "?")
                failed=$(cat "$report" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('failed',0))" 2>/dev/null || echo "?")
                cost=$(cat "$report" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"\\${d.get('token_usage_total',{}).get('cost_usd',0):.6f}\")" 2>/dev/null || echo "?")
                
                if [ "$failed" == "0" ]; then
                  echo "| $project | ✅ $passed passed, $failed failed | $cost |" >> $GITHUB_STEP_SUMMARY
                else
                  echo "| $project | ❌ $passed passed, $failed failed | $cost |" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "| $project | ⚠️ No report found | - |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "| $project | ⏭️ Skipped or not run | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Projetos Locais (com deploy + mocks)" >> $GITHUB_STEP_SUMMARY
          echo "| Projeto | Status | Custo |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          
          for project in mock-battery mock-filesystem; do
            dir="all-artifacts/mcp-${project}-artifacts"
            if [ -d "$dir" ]; then
              report=$(find "$dir" -name "mcp-report*.json" -path "*/reports/*" 2>/dev/null | head -1)
              
              if [ -n "$report" ] && [ -f "$report" ]; then
                passed=$(cat "$report" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('passed',0))" 2>/dev/null || echo "?")
                failed=$(cat "$report" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('failed',0))" 2>/dev/null || echo "?")
                cost=$(cat "$report" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"\\${d.get('token_usage_total',{}).get('cost_usd',0):.6f}\")" 2>/dev/null || echo "?")
                
                if [ "$failed" == "0" ]; then
                  echo "| $project | ✅ $passed passed, $failed failed | $cost |" >> $GITHUB_STEP_SUMMARY
                else
                  echo "| $project | ❌ $passed passed, $failed failed | $cost |" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "| $project | ⚠️ No report found | - |" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "| $project | ⏭️ Skipped or not run | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Artifacts uploaded for each project" >> $GITHUB_STEP_SUMMARY

      - name: Collect MCP JSON reports
        run: |
          python3 tcc-tests/scripts/gather_mcp_reports.py \
            --source all-artifacts \
            --dest report-inputs

      - name: Download previous history (if any)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p history
          echo "🔎 Buscando artifact de histórico anterior..."
          download_url=$(gh api repos/$REPO/actions/artifacts --paginate -q '.artifacts[] | select(.name=="mcp-tests-history" and .expired==false) | .archive_download_url' | head -n 1 || true)
          if [ -n "$download_url" ]; then
            echo "⬇️  Histórico encontrado, baixando..."
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -o history/history.zip "$download_url"
            unzip -o history/history.zip -d history >/dev/null
            rm history/history.zip
          else
            echo "ℹ️ Nenhum histórico anterior disponível."
          fi
          if [ ! -f history/history.json ]; then
            echo '{"runs":[]}' > history/history.json
          fi

      - name: Generate HTML report
        id: html_report
        run: |
          if compgen -G "report-inputs/*.json" > /dev/null; then
            python3 tcc-tests/scripts/report_generator.py report-inputs \
              --output mcp-tests-report.html \
              --history-input history/history.json \
              --history-output history/history.json \
              --history-run-id "${{ github.run_id }}" \
              --history-run-number "${{ github.run_number }}" \
              --history-workflow "${{ github.workflow }}" \
              --history-provider "${{ github.event.inputs.llm_provider || 'openai' }}" \
              --history-model "${{ github.event.inputs.llm_model || 'gpt-5-mini' }}" \
              --history-sha "${{ github.sha }}" \
              --history-trigger "${{ github.event_name }}" \
              --history-actor "${{ github.actor }}" \
              --history-timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum arquivo JSON encontrado para gerar o relatório HTML."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload HTML report
        if: steps.html_report.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mcp-tests-html-report
          path: mcp-tests-report.html

      - name: Upload updated history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-tests-history
          path: history/history.json
          if-no-files-found: warn

      - name: Referenciar relatório HTML no summary
        if: steps.html_report.outputs.generated == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Relatório HTML completo anexado como artifact **mcp-tests-html-report**." >> $GITHUB_STEP_SUMMARY
          echo "🕒 Histórico de execuções salvo em **mcp-tests-history**." >> $GITHUB_STEP_SUMMARY
